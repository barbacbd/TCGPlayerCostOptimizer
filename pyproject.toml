[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcgopt"
version = "0.1.0"
description = "Find the cheapest way to buy a list of TCGPlayer cards, including per-seller shipping"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PuLP>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tcgopt = "tcgopt.cli:main"

[project.gui-scripts]
tcgopt-gui = "tcgopt.gui:main"

[tool.setuptools.packages.find]
include = ["tcgopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
